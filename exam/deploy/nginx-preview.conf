# Before ICP registration: only accessible through an SSH tunnel.
log_format exam_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
server {
    listen 127.0.0.1:8080;
    server_name exam.example.com localhost;
    access_log /var/log/nginx/jqcn-exam.access.log exam_safe;
    error_log /var/log/nginx/jqcn-exam.error.log;
    client_max_body_size 2m;
    gzip on;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_cache off;
        add_header X-Content-Type-Options nosniff always;
    }
}
