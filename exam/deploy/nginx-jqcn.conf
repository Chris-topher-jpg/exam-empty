server {
    listen 80;
    listen [::]:80;
    server_name jqcnexam.yeshuyu.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jqcnexam.yeshuyu.com;
    ssl_certificate /etc/letsencrypt/live/jqcnexam.yeshuyu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jqcnexam.yeshuyu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    # Avoid recording candidate access tokens from query parameters.
    access_log off;
    error_log /var/log/nginx/jqcn-exam.error.log;
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        add_header X-Content-Type-Options nosniff always;
    }
}
